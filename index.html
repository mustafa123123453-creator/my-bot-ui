<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f0f0f0; }
        .btn { width: 90%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; text-align: center; font-size: 16px; }
        .blue { background-color: #5bc0de; } /* أزرق */
    </style>
</head>
<body>
    <button class="btn blue" onclick="send('get_id')">🆔 اضغط هنا لمعرفة الـ ID الخاص بك</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        function send(action) {
            tg.sendData(action);
            tg.close();
        }
    </script>
</body>
</html>
